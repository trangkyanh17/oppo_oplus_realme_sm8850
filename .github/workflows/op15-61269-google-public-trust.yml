name: OP15 6.12.69 Google public-key trust experiment (NOT FLASHABLE)

on:
  push:
    branches:
      - build/op15-61269-google-public-trust
    paths:
      - .github/workflows/op15-61269-google-public-trust.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends git curl ca-certificates python3 openssl unzip xz-utils zstd libelf-dev libssl-dev
          df -h .

      - name: Sync and pin verified Google GKI kernel source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/bin" "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/dist"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE/work"
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android16-6.12
          repo sync -c -j2 --fail-fast --no-tags
          cd common
          git fetch --no-tags https://android.googlesource.com/kernel/common refs/tags/android16-6.12-2026-03_r70:refs/tags/android16-6.12-2026-03_r70
          git checkout --detach refs/tags/android16-6.12-2026-03_r70
          test "$(git rev-parse HEAD)" = 5fd39602326ec050bf53ae07528e1fe1ecefb531
          # Preserve stock release for offline GKI module compatibility comparison.
          printf '%s\n' '{"SCMVERSION":"-g5fd39602326e-ab16372235"}' > workspace_status.json
          cd ..
          repo manifest -r -o "$GITHUB_WORKSPACE/dist/repo_manifest.xml"

      - name: Obtain publicly published Google GKI X509 from verified official CI
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/work/common"
          mkdir -p "$GITHUB_WORKSPACE/official" certs
          curl -fLsS --connect-timeout 25 --max-time 420 --retry 2 \
            https://ci.android.com/builds/submitted/16372235/kernel_aarch64/latest/raw/Image \
            -o "$GITHUB_WORKSPACE/official/Image"
          python3 - <<'PY'
          import pathlib, hashlib, subprocess, os
          work=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          data=(work/'official/Image').read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          assert digest == '8a42827cc541b10c3c7f3e6774193ed9bed6a905e1bea4bae6f760c43c29bfc5', f'Unexpected official GKI Image: {digest}'
          off=39344640
          assert data[off] == 0x30, 'No DER X.509 sequence at proven Google certificate offset'
          count=data[off+1]&0x7f
          assert 1 <= count <= 4
          length=2+count+int.from_bytes(data[off+2:off+2+count],'big')
          der=data[off:off+length]
          actual=hashlib.sha256(der).hexdigest()
          assert actual == '0c388b8140683034bd75c61dde1e0a7499a27c5cc08d4304ece0dd6ecbaf0f4d', actual
          (work/'official/google.der').write_bytes(der)
          pem=pathlib.Path.cwd()/'certs/google_gki_public_16372235.pem'
          subprocess.run(['openssl','x509','-inform','DER','-in',str(work/'official/google.der'),'-out',str(pem)],check=True)
          assert b'PRIVATE KEY' not in pem.read_bytes()
          print('Official public X509 verified:',len(der),'bytes; SHA256',actual)
          PY

      - name: Add official Google public trust anchor via supported Kleaf attribute
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/work/common"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('BUILD.bazel')
          s=p.read_text()
          head='common_kernel(\n    name = "kernel_aarch64",'
          pos=s.find(head)
          assert pos >= 0 and s.count(head)==1
          at=s.find('    system_dlkm_extra_archive_files = [":generate_gki_module_info_arm64"],',pos)
          end=s.find('\n)\n',pos)
          assert pos < at < end
          insert='    system_trusted_key = ":certs/google_gki_public_16372235.pem",\n'
          assert insert not in s
          s=s[:at]+insert+s[at:]
          p.write_text(s)
          print('Added documented kernel_build system_trusted_key label to GKI arm64 target only')
          PY
          # The public common_kernel() macro does not expose the underlying
          # kernel_build(system_trusted_key=...) attribute. Forward that
          # attribute explicitly, without altering the kernel source.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('../build/kernel/kleaf/common_kernels.bzl')
          s=p.read_text()
          head=s.index('def common_kernel(')
          end=s.index('):',head)
          sig=s[head:end]
          anchor='    system_dlkm_extra_archive_files = None,'
          assert sig.count(anchor)==1, 'Unexpected common_kernel macro signature'
          sig=sig.replace(anchor,anchor+'\n    system_trusted_key = None,')
          s=s[:head]+sig+s[end:]
          call=s.index('    kernel_build(',head)
          assert call>head
          cend=s.index('    name = name,',call)
          assert cend>call
          s=s[:call]+s[call:].replace('    kernel_build(\n',
              '    kernel_build(\n        system_trusted_key = system_trusted_key,\n',1)
          p.write_text(s)
          print('Forwarded system_trusted_key through common_kernel to kernel_build')
          PY
          grep -n -C 3 'system_trusted_key = ' BUILD.bazel
          git diff -- BUILD.bazel | head -65
          test -s certs/google_gki_public_16372235.pem

      - name: Build GKI with own signing key plus Google official public trust certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/work"
          tools/bazel run --config=stamp //common:kernel_aarch64_dist -- --destdir="$GITHUB_WORKSPACE/dist"

      - name: Fail closed unless real image contains official Google trust anchor
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          test -s Image
          test -s kernel_aarch64_dot_config
          test -s kernel_aarch64_Module.symvers
          python3 - <<'PY'
          import hashlib, pathlib, os, re
          dist=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'dist'
          official=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'official/google.der'
          data=(dist/'Image').read_bytes()
          trusted=official.read_bytes()
          config=(dist/'kernel_aarch64_dot_config').read_text()
          syms=(dist/'kernel_aarch64_Module.symvers').read_bytes()
          k_release=b'Linux version 6.12.69-android16-6-g5fd39602326e-ab16372235-4k '
          assert k_release in data, 'Image release mismatch'
          assert len(data)>40000000
          assert 'CONFIG_SYSTEM_TRUSTED_KEYS=""' not in config, 'Google trusted key NOT enabled in config'
          assert 'CONFIG_SYSTEM_TRUSTED_KEYS=' in config, 'Missing trusted key config'
          assert data.find(trusted)>=0, 'Official Google DER certificate NOT present in built Image'
          assert hashlib.sha256(syms).hexdigest()=='d546859ce4a45ae800b497f340488a71c815680c3437b90d22e4fa40f3adc00f', 'Changed GKI module CRC ABI'
          digest=hashlib.sha256(data).hexdigest()
          line=next(x for x in config.splitlines() if x.startswith('CONFIG_SYSTEM_TRUSTED_KEYS='))
          report=[
           'FLASH_QUALIFIED=NO',
           'SOURCE_COMMIT=5fd39602326ec050bf53ae07528e1fe1ecefb531',
           'SOURCE_TAG=android16-6.12-2026-03_r70',
           'GOOGLE_CI_PUBLIC_CERT_SHA256=0c388b8140683034bd75c61dde1e0a7499a27c5cc08d4304ece0dd6ecbaf0f4d',
           'GOOGLE_CERT_EMBEDDED_IN_BUILT_IMAGE=YES',
           'GKI_MODULE_SYMVERS_SHA256_MATCHES_STOCK_BASELINE=YES',
           'TRUSTED_KEY_CONFIG='+line,
           'IMAGE_SHA256='+digest,
           'MODULE_LOAD_TEST_ON_CPH2745=NOT_PERFORMED',
           'STOCK_OEM_MODULE_RUNTIME_TEST=NOT_PERFORMED',
           'DO_NOT_FLASH_AUTOMATICALLY=YES',
           'NOTE=Official X509 public key downloaded from publicly available Google CI Image; no user device files uploaded',
          ]
          (dist/'TRUST_VALIDATION.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY
          cp kernel_aarch64_dot_config kernel.config
          cp kernel_aarch64_Module.symvers Module.symvers
          sha256sum Image Module.symvers kernel.config > SHA256SUMS
          ls -lh Image TRUST_VALIDATION.txt kernel.config Module.symvers

      - name: Publish experimental audit artifact (never flash)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OP15-61269-GOOGLE-PUBLIC-TRUST-EXPERIMENT-NOT-FLASH
          path: |
            dist/Image
            dist/Module.symvers
            dist/kernel.config
            dist/SHA256SUMS
            dist/TRUST_VALIDATION.txt
            dist/repo_manifest.xml
          if-no-files-found: error
          retention-days: 14
