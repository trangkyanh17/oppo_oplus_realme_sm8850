name: OP15 GKI 6.12.69 stock build-metadata reproduction (NOT FLASHABLE)

on:
  push:
    branches:
      - build/op15-stock-61269-r70
    paths:
      - .github/workflows/op15-stock-61269-r70.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Google 6.12.69 android16-6 / 4K source-locked
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk and install dependencies
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends git curl ca-certificates python3 unzip xz-utils zstd libelf-dev libssl-dev
          df -h .
          free -h
      - name: Pin Google GKI source and build image
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_TAG=android16-6.12-2026-03_r70
          EXPECTED_SHA=5fd39602326ec050bf53ae07528e1fe1ecefb531
          EXPECTED_VERSION=6.12.69
          BUILD_ID=16372235
          echo "Source: $EXPECTED_TAG SHA=$EXPECTED_SHA GKI build=$BUILD_ID"
          mkdir -p "$HOME/bin" "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/dist"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE/work"
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android16-6.12
          repo sync -c -j2 --fail-fast --no-tags
          cd common
          git fetch --no-tags https://android.googlesource.com/kernel/common "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
          git -c advice.detachedHead=false checkout --detach "refs/tags/$EXPECTED_TAG"
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Source SHA mismatch: $ACTUAL_SHA"; exit 10; }
          test "$(awk '/^VERSION =/{print $3}' Makefile)" = 6
          test "$(awk '/^PATCHLEVEL =/{print $3}' Makefile)" = 12
          test "$(awk '/^SUBLEVEL =/{print $3}' Makefile)" = 69
          # Reproduce Google CI's known build-number metadata using Kleaf's
          # documented workspace_status.json override. This does NOT assert
          # binary identity or compatibility with stock OnePlus vendor modules.
          printf '%s\n' '{"SCMVERSION":"-g5fd39602326e-ab16372235"}' > workspace_status.json
          cd ..
          # Pin the actual checked-out manifest, not only the GKI commit.
          repo manifest -r -o "$GITHUB_WORKSPACE/dist/repo_manifest.xml"
          echo "Common SHA: $ACTUAL_SHA"
          echo '### Git common worktree status'
          git -C common status --short
          test -x tools/bazel || { echo 'Missing tools/bazel'; exit 11; }
          # Kleaf SCM stamp: avoid the unversioned -maybe-dirty build.
          tools/bazel run --config=stamp //common:kernel_aarch64_dist -- --destdir="$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE/dist"
          test -s Image || { echo 'No Image artifact'; exit 12; }
          echo '### Check image banner'
          LC_ALL=C grep -aom1 'Linux version 6\.12\.69[^[:space:]]*' Image | tee IMAGE_VERSION.txt
          grep -q 'android16-6' IMAGE_VERSION.txt || { echo 'KMI mismatch'; exit 13; }
          grep -q '4k' IMAGE_VERSION.txt || { echo 'Page size suffix mismatch'; exit 14; }
          if grep -q 'maybe-dirty' IMAGE_VERSION.txt; then
            echo 'ERROR: SCM stamping failed (maybe-dirty remains)'
            exit 15
          fi
          if ! grep -q 'g5fd39602326e' IMAGE_VERSION.txt; then
            echo 'ERROR: Image is missing the expected source commit fingerprint'
            exit 16
          fi
          EXPECTED_FULL_RELEASE='6.12.69-android16-6-g5fd39602326e-ab16372235-4k'
          grep -Fxq "Linux version $EXPECTED_FULL_RELEASE" IMAGE_VERSION.txt || {
            echo 'ERROR: Kleaf metadata reproduction failed (unexpected full release)'
            exit 17
          }
          echo '### Dist files'
          find . -maxdepth 2 -type f -printf '%P (%s bytes)\\n' | sort | tee DIST_CONTENTS.txt
          printf '%s\n' \
            'Scope=Google GKI 6.12.69 baseline; not OnePlus OEM verified/flash-qualified' \
            "Tag=$EXPECTED_TAG" "Common_SHA=$ACTUAL_SHA" \
            "Google_CI_Reference_Build_ID=$BUILD_ID" \
            'Target=OnePlus 15 CPH2745 4 KB android16-6' \
            'Toolchain=manifest common-android16-6.12 bootstrap (not proven identical to Google CI)' \
            > BUILD_INFO.txt
          sha256sum Image > SHA256SUMS
          echo 'This run reproduces official Google CI build-number METADATA, not a proven byte-identical Google CI/OnePlus stock binary.' >> BUILD_INFO.txt
          # Kleaf dist outputs are not guaranteed to contain .config / Module.symvers.
          # Preserve them if present, but never mistake missing files for a completed ABI check.
          if test -f kernel_aarch64_dot_config; then cp kernel_aarch64_dot_config kernel.config; fi
          if test -f kernel_aarch64_Module.symvers; then
            cp kernel_aarch64_Module.symvers Module.symvers
          else
            echo 'Missing Module.symvers; cannot publish ABI evidence'
            exit 18
          fi
          echo 'KMI/module ABI compatibility with CPH2745 firmware: NOT VERIFIED' >> BUILD_INFO.txt
          echo 'Build completed; image is NOT flash-qualified.'
          ls -lh Image BUILD_INFO.txt SHA256SUMS
      - name: Upload image and evidence; never flash automatically
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OP15-61269-GKI-Repro-AB16372235-NOT-FLASH-QUALIFIED
          path: |
            dist/Image
            dist/IMAGE_VERSION.txt
            dist/BUILD_INFO.txt
            dist/SHA256SUMS
            dist/kernel.config
            dist/Module.symvers
            dist/repo_manifest.xml
            dist/DIST_CONTENTS.txt
          if-no-files-found: error
          retention-days: 14
